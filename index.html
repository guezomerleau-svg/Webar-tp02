<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP02 - Web3D (Complet Exercices 1 à 6)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
    <!-- Chargement de Three.js, OrbitControls et du moteur physique Cannon.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>

<script>
    // -----------------------------------------------------------------
    // 1. INITIALISATION DE LA SCÈNE, CAMÉRA ET MOTEUR PHYSIQUE
    // -----------------------------------------------------------------
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
        75, 
        window.innerWidth / window.innerHeight, 
        0.1, 
        1000
    );
    camera.position.set(0, 8, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Initialisation du monde physique Cannon.js (Exercices 5 & 6)
    const world = new CANNON.World();
    world.gravity.set(0, -20, 0); // Gravité
    world.broadphase = new CANNON.NaiveBroadphase();

    const physicsMaterial = new CANNON.Material('default');
    const contactMaterial = new CANNON.ContactMaterial(
        physicsMaterial, 
        physicsMaterial, 
        { friction: 0.4, restitution: 0.2 }
    );
    world.addContactMaterial(contactMaterial);

    // Éclairage
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(20, 40, 20);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // -----------------------------------------------------------------
    // EXERCICE 1 : PLAN (SOL) ET SKYBOX
    // -----------------------------------------------------------------
    const textureLoader = new THREE.TextureLoader();

    // Sol avec texture d'herbe
    const grassTexture = textureLoader.load('https://threejs.org/examples/textures/terrain/grasslight-big.jpg');
    grassTexture.wrapS = THREE.RepeatWrapping;
    grassTexture.wrapT = THREE.RepeatWrapping;
    grassTexture.repeat.set(50, 50);

    const planeSize = 100;
    const planeGeo = new THREE.PlaneGeometry(planeSize, planeSize);
    const planeMat = new THREE.MeshStandardMaterial({ map: grassTexture });
    const plane = new THREE.Mesh(planeGeo, planeMat);
    plane.rotation.x = -Math.PI / 2;
    plane.receiveShadow = true;
    scene.add(plane);

    // Plan physique au niveau du sol
    const groundBody = new CANNON.Body({ mass: 0, material: physicsMaterial });
    groundBody.addShape(new CANNON.Plane());
    groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
    world.addBody(groundBody);

    // Skybox panoramique
    const skyTexture = textureLoader.load('https://threejs.org/examples/textures/22944123048_24a3b1029d_o.jpg');
    const skyGeo = new THREE.SphereGeometry(500, 60, 40);
    const skyMat = new THREE.MeshBasicMaterial({ map: skyTexture, side: THREE.BackSide });
    scene.add(new THREE.Mesh(skyGeo, skyMat));

    // -----------------------------------------------------------------
    // EXERCICES 2, 4, 5 : JOUEUR (CUBE PRINCIPAL) & STABILITÉ
    // -----------------------------------------------------------------
    const cubeSize = 2;
    const halfExtents = new CANNON.Vec3(cubeSize / 2, cubeSize / 2, cubeSize / 2);

    // Rendu visuel Three.js
    const cubeGeo = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
    const playerMat = new THREE.MeshStandardMaterial({ color: 0x3498db });
    const player = new THREE.Mesh(cubeGeo, playerMat);
    player.castShadow = true;
    scene.add(player);

    // Corps physique Cannon.js (Exercice 5)
    const playerBody = new CANNON.Body({
        mass: 5,
        shape: new CANNON.Box(halfExtents),
        position: new CANNON.Vec3(0, cubeSize / 2, 0),
        material: physicsMaterial
    });

    // EXERCICE 5 : Réduire l'impact des collisions sur la rotation (Garder le cube stable)
    playerBody.fixedRotation = true;
    playerBody.updateMassProperties();
    world.addBody(playerBody);

    // -----------------------------------------------------------------
    // EXERCICE 6 : CUBES D'OBSTACLES / INTERACTIONS ET COLLISIONS
    // -----------------------------------------------------------------
    const obstacleCubes = [];
    const positions = [
        [4, 1, -4], [-5, 1, -5], [6, 1, 3], [-4, 1, 5],
        [0, 1, -8], [7, 1, -10], [-7, 1, -2]
    ];

    positions.forEach(pos => {
        const obsMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c });
        const obsMesh = new THREE.Mesh(cubeGeo, obsMat);
        obsMesh.castShadow = true;
        obsMesh.receiveShadow = true;
        scene.add(obsMesh);

        const obsBody = new CANNON.Body({
            mass: 2, // Mass physique (poussable)
            shape: new CANNON.Box(halfExtents),
            position: new CANNON.Vec3(pos[0], pos[1], pos[2]),
            material: physicsMaterial
        });
        obsBody.angularDamping = 0.5; // Amortissement des rotations lors des chocs
        world.addBody(obsBody);

        obstacleCubes.push({ mesh: obsMesh, body: obsBody });
    });

    // -----------------------------------------------------------------
    // EXERCICE 3 : CAMÉRA ORBITALE ET LIMITES
    // -----------------------------------------------------------------
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 4;
    controls.maxDistance = 25;
    controls.maxPolarAngle = Math.PI / 2 - 0.02; // Limite inférieure (empêche de passer sous le sol)
    controls.minPolarAngle = 0.1;               // Limite supérieure
    controls.enablePan = false;

    // -----------------------------------------------------------------
    // GESTION DES TOUCHES DU CLAVIER
    // -----------------------------------------------------------------
    const keys = { w: false, a: false, s: false, d: false, space: false };

    window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'w' || key === 'z') keys.w = true;
        if (key === 'a' || key === 'q') keys.a = true;
        if (key === 's') keys.s = true;
        if (key === 'd') keys.d = true;
        if (e.code === 'Space') keys.space = true;
    });

    window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'w' || key === 'z') keys.w = false;
        if (key === 'a' || key === 'q') keys.a = false;
        if (key === 's') keys.s = false;
        if (key === 'd') keys.d = false;
        if (e.code === 'Space') keys.space = false;
    });

    // Détection de contact pour autoriser le saut uniquement au sol (Exercices 2, 4, 5)
    let isGrounded = false;
    playerBody.addEventListener('collide', (e) => {
        const contact = e.contact;
        const normal = contact.bi.id === playerBody.id ? contact.ni : contact.ni.negate();
        if (normal.y > 0.5) {
            isGrounded = true;
        }
    });

    const clock = new THREE.Clock();
    const prevPlayerPos = new THREE.Vector3().copy(playerBody.position);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // -----------------------------------------------------------------
    // BOUCLE DE RENDU PRINCIPALE
    // -----------------------------------------------------------------
    const moveSpeed = 12;

    function animate() {
        requestAnimationFrame(animate);

        const delta = Math.min(clock.getDelta(), 0.1);

        // Mettre à jour la simulation physique
        world.step(1 / 60, delta, 3);

        // --- EXERCICE 4 : CALCUL DU DÉPLACEMENT RELATIF À L'ORIENTATION DE LA CAMÉRA ---
        const forward = new THREE.Vector3();
        camera.getWorldDirection(forward);
        forward.y = 0; // Se déplacer horizontalement uniquement
        forward.normalize();

        const right = new THREE.Vector3();
        right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).negate();

        const moveDir = new THREE.Vector3(0, 0, 0);
        if (keys.w) moveDir.add(forward);
        if (keys.s) moveDir.sub(forward);
        if (keys.d) moveDir.add(right);
        if (keys.a) moveDir.sub(right);

        if (moveDir.lengthSq() > 0) {
            moveDir.normalize();
        }

        // Application de la vitesse physique au corps
        playerBody.velocity.x = moveDir.x * moveSpeed;
        playerBody.velocity.z = moveDir.z * moveSpeed;

        // Gestion du saut
        if (keys.space && isGrounded) {
            playerBody.velocity.y = 10;
            isGrounded = false;
        }

        // Synchronisation des objets Three.js avec la physique Cannon.js
        player.position.copy(playerBody.position);
        player.quaternion.copy(playerBody.quaternion);

        obstacleCubes.forEach(obj => {
            obj.mesh.position.copy(obj.body.position);
            obj.mesh.quaternion.copy(obj.body.quaternion);
        });

        // --- EXERCICE 3 : SUIVI AUTOMATIQUE DE LA CAMÉRA ---
        const currentPos = new THREE.Vector3().copy(playerBody.position);
        const playerDelta = new THREE.Vector3().subVectors(currentPos, prevPlayerPos);
        camera.position.add(playerDelta);
        controls.target.copy(currentPos);
        prevPlayerPos.copy(currentPos);

        controls.update();
        renderer.render(scene, camera);
    }

    animate();
</script>

</body>
</html>
