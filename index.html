<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP02 - Web3D (Correctif Complet)</title>

    <!-- Chargement de A-Frame, du Physics System et d'Orbit Controls -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
    <script src="https://unpkg.com/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>

<script>
    // -----------------------------------------------------------------
    // COMPOSANT CUSTOM : CONTROLEUR DU JOUEUR (Exercices 2, 4, 5)
    // -----------------------------------------------------------------
    AFRAME.registerComponent('player-controller', {
        schema: {
            speed: { type: 'number', default: 12 },
            accel: { type: 'number', default: 12 },
            decel: { type: 'number', default: 18 },
            jumpForce: { type: 'number', default: 10 }
        },
        init: function () {
            this.keys = { w: false, a: false, s: false, d: false, space: false };
            this.isGrounded = false;
            this.currentVel = new THREE.Vector3(0, 0, 0);

            // Gestion des entrées clavier (support ZQSD et WASD)
            window.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();
                if (key === 'w' || key === 'z') this.keys.w = true;
                if (key === 'a' || key === 'q') this.keys.a = true;
                if (key === 's') this.keys.s = true;
                if (key === 'd') this.keys.d = true;
                if (e.code === 'Space') this.keys.space = true;
            });

            window.addEventListener('keyup', (e) => {
                const key = e.key.toLowerCase();
                if (key === 'w' || key === 'z') this.keys.w = false;
                if (key === 'a' || key === 'q') this.keys.a = false;
                if (key === 's') this.keys.s = false;
                if (key === 'd') this.keys.d = false;
                if (e.code === 'Space') this.keys.space = false;
            });

            // Exercice 2 : Calcul dynamique de la hauteur initiale pour que le bas du cube touche le sol
            this.el.addEventListener('body-loaded', () => {
                const height = this.el.getAttribute('height') || 2;
                const pos = this.el.getAttribute('position');
                this.el.body.position.y = height / 2;
            });
        },

        // Vérification dynamique des contacts physiques à chaque frame
        checkGroundedState: function (body) {
            if (!body || !body.world) return false;
            
            for (let i = 0; i < body.world.contacts.length; i++) {
                const c = body.world.contacts[i];
                if (c.bi.id === body.id || c.bj.id === body.id) {
                    const normal = c.bi.id === body.id ? c.ni : c.ni.negate();
                    // Si la normale pointe vers le haut, le cube s'appuie sur une surface horizontale
                    if (normal.y > 0.5) {
                        return true;
                    }
                }
            }
            return false;
        },

        tick: function (time, delta) {
            const dt = delta / 1000;
            if (!dt || dt > 0.1) return;

            const body = this.el.body;
            if (!body) return;

            // Exercice 5 : Bloquer la rotation du cube lors des collisions
            body.fixedRotation = true;
            body.updateMassProperties();

            // Exercice 2 : Détection temps réel de la présence au sol
            this.isGrounded = this.checkGroundedState(body);

            // Récupération de la vue caméra
            const cameraEl = this.el.sceneEl.camera;
            if (!cameraEl) return;

            // --- EXERCICE 4 : VECTEURS DE DÉPLACEMENT RELATIFS À LA CAMÉRA ---
            const forward = new THREE.Vector3();
            cameraEl.getWorldDirection(forward);
            forward.y = 0; // Se déplacer uniquement dans le plan horizontal
            forward.normalize();

            const right = new THREE.Vector3();
            right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

            const inputDir = new THREE.Vector3(0, 0, 0);
            if (this.keys.w) inputDir.add(forward);
            if (this.keys.s) inputDir.sub(forward);
            if (this.keys.d) inputDir.add(right);
            if (this.keys.a) inputDir.sub(right);

            if (inputDir.lengthSq() > 0) {
                inputDir.normalize();
            }

            // --- EXERCICE 2 : ACCÉLÉRATION ET DÉCÉLÉRATION PROGRESSIVES ---
            const targetVx = inputDir.x * this.data.speed;
            const targetVz = inputDir.z * this.data.speed;

            const rate = (inputDir.lengthSq() > 0) ? this.data.accel : this.data.decel;

            this.currentVel.x += (targetVx - this.currentVel.x) * Math.min(rate * dt, 1);
            this.currentVel.z += (targetVz - this.currentVel.z) * Math.min(rate * dt, 1);

            body.velocity.x = this.currentVel.x;
            body.velocity.z = this.currentVel.z;

            // --- EXERCICES 2 & 5 : SAUT CONDITIONNÉ AU SOL ---
            if (this.keys.space && this.isGrounded) {
                body.velocity.y = this.data.jumpForce;
                this.isGrounded = false;
            }
        }
    });

    // -----------------------------------------------------------------
    // COMPOSANT CUSTOM : SUIVI CAMÉRA (Exercice 3)
    // -----------------------------------------------------------------
    AFRAME.registerComponent('camera-follow', {
        schema: { target: { type: 'selector' } },
        init: function () {
            this.prevPos = new THREE.Vector3();
            if (this.data.target) {
                this.data.target.object3D.getWorldPosition(this.prevPos);
            }
        },
        tick: function () {
            if (!this.data.target) return;

            const currentPos = new THREE.Vector3();
            this.data.target.object3D.getWorldPosition(currentPos);

            const deltaPos = new THREE.Vector3().subVectors(currentPos, this.prevPos);
            
            // Suivi en translation
            this.el.object3D.position.add(deltaPos);

            // Mise à jour de la cible du contrôle d'orbite
            const controlsComp = this.el.components['orbit-controls'];
            if (controlsComp && controlsComp.controls) {
                controlsComp.controls.target.copy(currentPos);
            }

            this.prevPos.copy(currentPos);
        }
    });
</script>

<!-- SCÈNE A-FRAME ET MOTEUR PHYSIQUE (aframe-physics-system) -->
<a-scene physics="gravity: -19.6; debug: false">

    <a-assets>
        <!-- Textures Sol et Skybox -->
        <img id="grass" src="https://threejs.org/examples/textures/terrain/grasslight-big.jpg" crossorigin="anonymous">
        <img id="sky" src="https://threejs.org/examples/textures/22944123048_24a3b1029d_o.jpg" crossorigin="anonymous">
    </a-assets>

    <!-- EXERCICE 1 : Skybox -->
    <a-sky src="#sky"></a-sky>

    <!-- EXERCICE 1 & 5 : Plan (Sol) avec texture répétée et corps physique statique -->
    <a-plane 
        src="#grass" 
        repeat="50 50" 
        rotation="-90 0 0" 
        width="100" 
        height="100" 
        static-body
        shadow="receive: true">
    </a-plane>

    <!-- EXERCICES 2, 4, 5 : Cube Joueur -->
    <a-box id="player"
           position="0 1 0"
           width="2" height="2" depth="2"
           color="#3498db"
           dynamic-body="mass: 5; shape: box"
           player-controller="speed: 12; accel: 12; decel: 18; jumpForce: 10"
           shadow="cast: true; receive: true">
    </a-box>

    <!-- EXERCICE 6 : Obstacles physiques réactifs avec aframe-physics-system -->
    <a-box position="4 1 -4" width="2" height="2" depth="2" color="#e74c3c" dynamic-body="mass: 2" shadow="cast: true"></a-box>
    <a-box position="-5 1 -5" width="2" height="2" depth="2" color="#e74c3c" dynamic-body="mass: 2" shadow="cast: true"></a-box>
    <a-box position="6 1 3" width="2" height="2" depth="2" color="#e74c3c" dynamic-body="mass: 2" shadow="cast: true"></a-box>
    <a-box position="-4 1 5" width="2" height="2" depth="2" color="#e74c3c" dynamic-body="mass: 2" shadow="cast: true"></a-box>
    <a-box position="0 1 -8" width="2" height="2" depth="2" color="#e74c3c" dynamic-body="mass: 2" shadow="cast: true"></a-box>
    <a-box position="7 1 -10" width="2" height="2" depth="2" color="#e74c3c" dynamic-body="mass: 2" shadow="cast: true"></a-box>
    <a-box position="-7 1 -2" width="2" height="2" depth="2" color="#e74c3c" dynamic-body="mass: 2" shadow="cast: true"></a-box>

    <!-- Éclairage -->
    <a-entity light="type: ambient; color: #FFF; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 0.8; castShadow: true" position="20 40 20"></a-entity>

    <!-- EXERCICE 3 : Caméra Orbitale avec limites adaptées -->
    <a-entity id="cameraRig"
              position="0 8 12"
              camera-follow="target: #player"
              orbit-controls="
                  target: 0 1 0;
                  enableDamping: true;
                  dampingFactor: 0.05;
                  minDistance: 4;
                  maxDistance: 25;
                  minPolarAngle: 0.05;      /* Angle quasi-vertical supérieur (~0° à 90°) */
                  maxPolarAngle: 1.550796;  /* Limite inférieure (~88.8°) empêchant de passer sous le sol */
                  enablePan: false;
              ">
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-entity>

</a-scene>

</body>
</html>
